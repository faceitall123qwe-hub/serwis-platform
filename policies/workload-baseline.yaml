# Baseline for workloads in the serwis namespace, written as CEL (Kyverno ValidatingPolicy).
# Database pods are created by the CloudNativePG operator and are excluded by label.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: serwis-workload-baseline
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: serwis
    objectSelector:
      matchExpressions:
        - { key: cnpg.io/cluster, operator: DoesNotExist }
  variables:
    - name: containers
      expression: object.spec.containers + object.spec.?initContainers.orValue([])
  validations:
    - message: Images must use a pinned tag, not ':latest' or no tag at all.
      expression: >-
        variables.containers.all(c,
          c.image.split('/')[size(c.image.split('/')) - 1].contains(':') &&
          !c.image.endsWith(':latest'))
    - message: Every container needs CPU and memory requests and a memory limit.
      expression: >-
        variables.containers.all(c,
          'cpu' in c.?resources.?requests.orValue({}) &&
          'memory' in c.?resources.?requests.orValue({}) &&
          'memory' in c.?resources.?limits.orValue({}))
    - message: Pods must run as non-root and containers must not allow privilege escalation.
      expression: >-
        object.spec.?securityContext.?runAsNonRoot.orValue(false) == true &&
        variables.containers.all(c, c.?securityContext.?allowPrivilegeEscalation.orValue(true) == false)
