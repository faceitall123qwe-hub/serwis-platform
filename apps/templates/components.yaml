{{- define "app.syncPolicy" }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
{{- end }}
# ---------- wave -2: operators and controllers ----------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.15.1
    helm:
      valuesObject:
        controller:
          hostPort: { enabled: true }
          service: { type: NodePort }
          nodeSelector: { ingress-ready: "true" }
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          watchIngressWithoutClass: true
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
              additionalLabels: { release: kube-prometheus-stack }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  {{- include "app.syncPolicy" . }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/metrics-server/
    chart: metrics-server
    targetRevision: 3.14.0
    helm:
      valuesObject:
        args: [--kubelet-insecure-tls]   # kind's kubelets use self-signed certs
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  {{- include "app.syncPolicy" . }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: 0.29.1
  destination:
