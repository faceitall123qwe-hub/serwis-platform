---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 91.9.0
    helm:
      valuesObject:
        # Control-plane components aren't reachable for scraping in kind.
        kubeEtcd: { enabled: false }
        kubeControllerManager: { enabled: false }
        kubeScheduler: { enabled: false }
        kubeProxy: { enabled: false }
        alertmanager:
          alertmanagerSpec:
            resources: { requests: { cpu: 10m, memory: 32Mi } }
        prometheus:
          prometheusSpec:
            retention: 2d
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            resources: { requests: { cpu: 100m, memory: 400Mi } }
        grafana:
          admin:
            existingSecret: grafana-admin   # created by bootstrap/install.sh
            userKey: admin-user
            passwordKey: admin-password
          ingress:
            enabled: true
            ingressClassName: nginx
            hosts: [grafana.127.0.0.1.nip.io]
          sidecar:
            dashboards:
              enabled: true
              searchNamespace: ALL
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  {{- include "app.syncPolicy" . }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno
    chart: kyverno
    targetRevision: 3.9.1
    helm:
      valuesObject:
        admissionController: { replicas: 1 }
        backgroundController: { replicas: 1 }
        cleanupController: { replicas: 1 }
        reportsController: { replicas: 1 }
        # Without these the subchart renders `labels: {}` on its CRDs; the API server
        # drops empty maps and Argo CD would report the app as permanently OutOfSync.
        kyverno-api:
          labels: { app.kubernetes.io/part-of: kyverno }
          annotations: { platform.serwis/managed-by: argocd }
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  {{- include "app.syncPolicy" . }}
---
# ---------- wave -1: platform config that needs the CRDs above ----------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.revision }}
    path: policies
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  {{- include "app.syncPolicy" . }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.revision }}
    path: monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  {{- include "app.syncPolicy" . }}
---
# ---------- wave 0: the application ----------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: serwis
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.revision }}
    path: charts/serwis
  destination:
    server: https://kubernetes.default.svc
    namespace: serwis
  {{- include "app.syncPolicy" . }}
