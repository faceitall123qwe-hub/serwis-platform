# Default deny for inbound traffic in the namespace, then explicit allows.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-from-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: serwis
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - { port: 3000 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-access
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: serwis-db
  policyTypes: [Ingress]
  ingress:
    # app, migration job, and replication between the database instances
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: serwis
        - podSelector:
            matchLabels:
              cnpg.io/cluster: serwis-db
      ports:
        - { port: 5432 }
    # CloudNativePG operator talks to the instance manager
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - { port: 8000 }
    # Prometheus scrapes the Postgres exporter
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - { port: 9187 }
